name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["24.10.0", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks (pinned release, checksum verified)
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
      # The verdict must not depend on files a pull request can add: drop any in-tree gitleaks config,
      # read .gitleaksignore from an empty directory and ignore inline gitleaks:allow comments.
      # --text defeats a .gitattributes "-diff"; --diff-merges=separate also scans merge resolutions.
      - name: scan full history
        run: |
          rm -f .gitleaks.toml
          mkdir -p "$RUNNER_TEMP/no-ignore"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore" --log-opts="--all --text --diff-merges=separate" .
